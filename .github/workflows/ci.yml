name: CI

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  verify_files:
    name: Verify Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Packages
        run: npm ci
      - name: Lint Files
        run: npm run lint
      - name: Verify generated theme is up to date
        run: |
          npm run generate:theme
          git diff --exit-code styles/themes/default.generated.css styles/themes/hc.generated.css

  typecheck:
    name: Typecheck (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Packages
        run: npm ci
      - name: Install React 18
        if: matrix.react == 18
        run: npm install --no-save react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - name: Typecheck
        run: npm run typecheck

  unit_tests:
    name: Unit Tests (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Packages
        run: npm ci
      - name: Install React 18
        if: matrix.react == 18
        run: npm install --no-save react@18 react-dom@18
      - name: Run Tests
        run: npm run test
