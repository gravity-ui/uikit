name: Release

on:
  push:
    branches:
      - main
      - release/v*

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      created: ${{ steps.release_action.outputs['release-created'] }}
      sha: ${{ steps.release_action.outputs['release-sha'] }}
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.GRAVITY_UI_APP_ID }}
          private-key: ${{ secrets.GRAVITY_UI_APP_PRIVATE_KEY }}
      - name: Release from ${{ github.ref_name }}
        id: release_action
        # Pin to the merge commit of the release-action PR before merging this workflow.
        uses: gravity-ui/release-action@REPLACE_WITH_MERGE_COMMIT_SHA
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          publish: 'false'
          node-version: '20'
          default-branch: ${{ github.ref_name != 'main' && github.ref_name || null }}

  publish:
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Publish
        env:
          NPM_DIST_TAG: ${{ github.ref_name == 'main' && 'latest' || 'untagged' }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"
