name: Star History

on:
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    if: github.repository == 'gravity-ui/uikit'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: '.github/scripts/star-history/package-lock.json'
      # The chart toolchain has its own manifest so that @gravity-ui/charts,
      # Playwright and esbuild stay out of the published package and out of every
      # contributor's install.
      - name: Install chart toolchain
        working-directory: .github/scripts/star-history
        run: npm ci
      - name: Install Chromium
        working-directory: .github/scripts/star-history
        run: npx playwright install --with-deps chromium
      # @gravity-ui/charts draws imperatively and lays out its axes from measured
      # text, so the chart is rendered in a real browser and the resulting SVG is
      # lifted out with its computed styles inlined.
      - name: Generate charts
        working-directory: .github/scripts/star-history
        run: node index.mjs --out "$GITHUB_WORKSPACE/star-history-out"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The charts live in an orphan single-commit branch so the main history
      # stays clean; README references them via raw.githubusercontent.com.
      - name: Publish to star-history-data branch
        working-directory: star-history-out
        run: |
          git init -q -b star-history-data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "chore: update star history chart"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" star-history-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
